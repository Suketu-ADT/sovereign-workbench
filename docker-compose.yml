services:
  postgres:
    image: postgres:16-alpine
    container_name: sovereign-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-sovereign}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sovereign_secure_change_me_prod_db_pass_9981}
      POSTGRES_DB: ${POSTGRES_DB:-sovereign}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-sovereign}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - sovereign-net

  qdrant:
    image: qdrant/qdrant:v1.13.0
    container_name: sovereign-qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/6333 && exit 0' || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - sovereign-net

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: sovereign-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - ENVIRONMENT=production
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-sovereign}:${POSTGRES_PASSWORD:-sovereign_secure_change_me_prod_db_pass_9981}@postgres:5432/${POSTGRES_DB:-sovereign}
      - QDRANT_URL=http://qdrant:6333
      - FASTEMBED_CACHE_PATH=/app/data/fastembed_cache
      - JWT_SECRET=${JWT_SECRET:-sovereign_prod_airgapped_jwt_secret_must_be_overridden_by_env_at_least_32_chars_long_1234}
      - JWT_EXPIRE_MINUTES=480
      - PROMPT_GUARD_ENABLED=true
      - LOCAL_VLM_ENABLED=false
      - PLANNER_MODEL_ENABLED=false
    volumes:
      - ./data:/app/data
    depends_on:
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s
    networks:
      - sovereign-net
      - sandbox-net

  frontend:
    image: nginx:alpine
    container_name: sovereign-frontend
    restart: unless-stopped
    ports:
      - "80:80"
      - "8080:80"
    volumes:
      - ./index.html:/usr/share/nginx/html/index.html:ro
      - ./styles.css:/usr/share/nginx/html/styles.css:ro
      - ./script.js:/usr/share/nginx/html/script.js:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - sovereign-net

  sandbox:
    build:
      context: ./sandbox
      dockerfile: Dockerfile
    container_name: sovereign-sandbox
    restart: unless-stopped
    read_only: true
    ports:
      - "8081:8080"
    tmpfs:
      - /tmp
    cpus: '0.1'
    mem_limit: 64m
    pids_limit: 50
    networks:
      - sandbox-net

volumes:
  pgdata:
  qdrant_data:

networks:
  sovereign-net:
    driver: bridge
  sandbox-net:
    driver: bridge
    internal: true
